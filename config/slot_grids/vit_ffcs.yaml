# Simplified VIT-style FFCS slot grid used by the mock VTOP connector.
# This is NOT the official VIT grid. Replace it with the real one (same format) when available.
name: "FFCS-style grid (simplified mock)"
days: [Mon, Tue, Wed, Thu, Fri]

# Theory periods, in order. Index in this list = column in theory_grid.
theory_periods:
  - ["08:00", "08:50"]
  - ["09:00", "09:50"]
  - ["10:00", "10:50"]
  - ["11:00", "11:50"]
  - ["12:00", "12:50"]
  - ["14:00", "14:50"]
  - ["15:00", "15:50"]
  - ["16:00", "16:50"]
  - ["17:00", "17:50"]
  - ["18:00", "18:50"]

theory_grid:
  Mon: [A1, F1, D1, TB1, TG1,  A2, F2, D2, TB2, TG2]
  Tue: [B1, G1, E1, TC1, TAA1, B2, G2, E2, TC2, TAA2]
  Wed: [C1, A1, F1, TD1, TCC1, C2, A2, F2, TD2, TCC2]
  Thu: [D1, B1, G1, TE1, TDD1, D2, B2, G2, TE2, TDD2]
  Fri: [E1, C1, TA1, TF1, TBB1, E2, C2, TA2, TF2, TBB2]

# Lab slots: each Ln is one period. Morning labs L1-L25, afternoon labs L31-L55.
# Code = base + day_index * periods_per_half + position_in_half
lab_rule:
  morning_base: 1
  afternoon_base: 31
  periods_per_half: 5
